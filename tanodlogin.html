<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanod Login - E-Reklamo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="tanodlogin.css">
</head>

<body>

    <div class="login-container" id="loginContainer">

        <div class="logo">
            <span class="brand-mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
            </span>
        </div>

        <h1>Tanod Login</h1>
        <p class="description">Enter your credentials to access the Responder Dashboard</p>

        <div class="error-message" id="errorMessage" role="alert">
            Invalid Tanod Number or Password. Please try again.
        </div>

        <form id="loginForm">

            <label for="tanodNumber">Tanod Number</label>
            <input type="text" id="tanodNumber" placeholder="e.g. 2X-XXXX" autocomplete="username" required>

            <label for="password">Password</label>
            <div class="password-wrap">
                <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
                <button type="button" class="toggle-pass" id="togglePass" aria-label="Show password" aria-pressed="false">Show</button>
            </div>

            <button type="submit" class="login-btn">Login</button>

        </form>

        <a href="index.html" class="back-link">← Back to role selection</a>

    </div>

    <script src="tanodloginscript.js"></script>
</body>
</html>
